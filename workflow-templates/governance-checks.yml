# Governance Checks Workflow Template
# Validates compliance with chittyfoundation governance directives
# Deploy to: .github/workflows/governance-checks.yml

name: Governance Checks

on:
  pull_request:
      types: [opened, synchronize, reopened]
        push:
            branches: [main, master]

            permissions:
              contents: read
                pull-requests: write

                env:
                  CANON_REPO: chittyfoundation/chittycanon
                    GOVERNANCE_PATH: gov/governance

                    jobs:
                      governance-validation:
                          name: Validate Governance Compliance
                              runs-on: ubuntu-latest

                                      steps:
                                            - name: Checkout code
                                                    uses: actions/checkout@v4
                                                            with:
                                                                      fetch-depth: 0

                                                                                  - name: Fetch governance rules
                                                                                          id: governance
                                                                                                  run: |
                                                                                                            echo "Fetching governance rules from chittycanon..."
                                                                                                                      # Clone governance repo to get latest rules
                                                                                                                                git clone --depth 1 https://github.com/${{ env.CANON_REPO }}.git /tmp/canon 2>/dev/null || true
                                                                                                                                          
                                                                                                                                                    if [ -d "/tmp/canon/${{ env.GOVERNANCE_PATH }}" ]; then
                                                                                                                                                                echo "✅ Governance rules loaded"
                                                                                                                                                                            echo "rules_found=true" >> $GITHUB_OUTPUT
                                                                                                                                                                                      else
                                                                                                                                                                                                  echo "⚠️ No governance rules found at ${{ env.GOVERNANCE_PATH }}"
                                                                                                                                                                                                              echo "rules_found=false" >> $GITHUB_OUTPUT
                                                                                                                                                                                                                        fi
                                                                                                                                                                                                                              
                                                                                                                                                                                                                                    - name: Check required files
                                                                                                                                                                                                                                            run: |
                                                                                                                                                                                                                                                      echo "=== Checking Required Governance Files ==="
                                                                                                                                                                                                                                                                status="pass"
                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                    # Check for SECURITY.md
                                                                                                                                                                                                                                                                                              if [ ! -f "SECURITY.md" ]; then
                                                                                                                                                                                                                                                                                                          echo "⚠️ Missing: SECURITY.md (recommended for governance)"
                                                                                                                                                                                                                                                                                                                    else
                                                                                                                                                                                                                                                                                                                                echo "✅ Found: SECURITY.md"
                                                                                                                                                                                                                                                                                                                                          fi
                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                              # Check for LICENSE alignment
                                                                                                                                                                                                                                                                                                                                                                        if [ -f "LICENSE" ] || [ -f "LICENSE.md" ]; then
                                                                                                                                                                                                                                                                                                                                                                                    echo "✅ Found: LICENSE file"
                                                                                                                                                                                                                                                                                                                                                                                              else
                                                                                                                                                                                                                                                                                                                                                                                                          echo "❌ Missing: LICENSE file (required)"
                                                                                                                                                                                                                                                                                                                                                                                                                      status="fail"
                                                                                                                                                                                                                                                                                                                                                                                                                                fi
                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                    # Check for CODEOWNERS
                                                                                                                                                                                                                                                                                                                                                                                                                                                              if [ -f ".github/CODEOWNERS" ] || [ -f "CODEOWNERS" ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "✅ Found: CODEOWNERS"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    else
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo "⚠️ Missing: CODEOWNERS (recommended)"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              echo "status=$status" >> $GITHUB_OUTPUT
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Validate branch protection patterns
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    echo "=== Branch Protection Validation ==="
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              echo "ℹ️ Reminder: Ensure branch protection is enabled for main/master branches"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo "Required settings:"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "  - Require PR reviews before merging"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "  - Require status checks to pass"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "  - Require conversation resolution"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - name: Check for sensitive patterns
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    echo "=== Sensitive Pattern Check ==="
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # Check for potential secrets or sensitive data in changes
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if git diff --cached --name-only 2>/dev/null | xargs grep -l -E "(api[_-]?key|secret|password|token)" 2>/dev/null; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    echo "⚠️ Warning: Potential sensitive data patterns detected"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo "Please ensure no secrets are being committed"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          else
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "✅ No obvious sensitive patterns detected"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            - name: Summary
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              echo ""
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo "=== Governance Check Summary ==="
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "Repository: ${{ github.repository }}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "Branch: ${{ github.ref_name }}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "Governance Source: chittycanon://${{ env.GOVERNANCE_PATH }}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo ""
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "For full governance documentation, see:"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    echo "https://github.com/${{ env.CANON_REPO }}"
