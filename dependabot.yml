# Organization-wide Dependabot configuration
# Per ChittyOS CI/CD SOPs - SOP-005: Security Scanning and Dependency Updates

version: 2
updates:
  - package-ecosystem: "npm"
      directory: "/"
          schedule:
                interval: "weekly"
                      day: "monday"
                          open-pull-requests-limit: 10
                              labels:
                                    - "dependencies"
                                          - "automated"
                                              commit-message:
                                                    prefix: "chore(deps)"

                                                      - package-ecosystem: "github-actions"
                                                          directory: "/"
                                                              schedule:
                                                                    interval: "weekly"
                                                                          day: "monday"
                                                                              labels:
                                                                                    - "dependencies"
                                                                                          - "ci"
                                                                                              commit-message:
                                                                                                    prefix: "ci(deps)"
